services:
  - type: web
    name: roadmap-smart-planner-backend
    runtime: python
    plan: free
    autoDeployTrigger: checksPass
    buildCommand: pip install -r requirements.txt && python roadmap/manage.py migrate --noinput && python roadmap/manage.py collectstatic --noinput
    startCommand: gunicorn roadmap.wsgi:application --chdir roadmap --bind 0.0.0.0:$PORT --log-file - --timeout 120
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DJANGO_SETTINGS_MODULE
        value: roadmap.settings
      - key: DJANGO_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        generateValue: true

      - key: DB_ENGINE
        value: django.db.backends.postgresql
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "5432"
      - key: DB_CONN_MAX_AGE
        value: "60"
      - key: DB_SSLMODE
        value: require

      - key: LLM_PRIMARY_PROVIDER
        value: groq
      - key: LLM_FALLBACKS
        value: ""
      - key: LLM_REQUEST_TIMEOUT_SECONDS
        value: "90"
      - key: LLM_MAX_RETRIES
        value: "2"
      - key: LLM_RETRY_BACKOFF_SECONDS
        value: "1.5"
      - key: AI_DEBUG
        value: "false"
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: LLAMA_3_3_70B
      - key: HIERARCHY_MODEL
        value: LLAMA_3_3_70B
      - key: JOURNEYBOOK_MODEL
        value: LLAMA_3_3_70B
      - key: TIMELINE_MODEL
        value: LLAMA_3_3_70B
      - key: CURRENT_SITUATION_MODEL
        value: LLAMA_3_3_70B
      - key: GIE_LANGUAGE_MODEL
        value: LLAMA_3_3_70B
      - key: JOURNAL_MODEL
        value: GPT_OSS_120B
      - key: HABIT_RECOMMENDATION_MODEL
        value: LLAMA_3_3_70B
      - key: GOAL_ATTRIBUTE_MODEL
        value: LLAMA_3_3_70B
      - key: GOAL_CATEGORY_MODEL
        value: LLAMA_3_3_70B
      - key: HIERARCHY_TASK_WORKERS
        value: "1"

      - key: CELERY_TASK_ALWAYS_EAGER
        value: "true"

      - key: USE_R2_STORAGE
        value: "true"
      - key: R2_BUCKET_NAME
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_ENDPOINT_URL
        sync: false
      - key: R2_PUBLIC_BASE_URL
        sync: false

      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: PASSWORD_RESET_URL
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: SENTRY_TRACES_SAMPLE_RATE
        value: "0.1"
      - key: SENTRY_PROFILES_SAMPLE_RATE
        value: "0"
      - key: SENTRY_SEND_DEFAULT_PII
        value: "false"
      - key: HUGGINGFACE_API_KEY
        sync: false

      - key: ALLOWED_HOSTS
        value: .onrender.com,localhost,127.0.0.1
      - key: CORS_ALLOWED_ORIGINS
        value: http://localhost:3000,http://127.0.0.1:3000
      - key: CORS_ALLOWED_ORIGIN_REGEXES
        value: ^https://[a-z0-9-]+\.vercel\.app$
      - key: CSRF_TRUSTED_ORIGINS
        value: http://localhost:3000,http://127.0.0.1:3000
