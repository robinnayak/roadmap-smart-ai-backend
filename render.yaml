services:
  - type: web
    name: roadmap-smart-planner-backend
    runtime: python
    plan: free
    autoDeployTrigger: checksPass
    buildCommand: pip install -r requirements.txt && python roadmap/manage.py migrate --noinput && python roadmap/manage.py collectstatic --noinput
    startCommand: gunicorn roadmap.wsgi:application --chdir roadmap --bind 0.0.0.0:$PORT --log-file - --timeout 120
    healthCheckPath: /health

    envVars:

      # -----------------------------------------------------------------------
      # Python & Django runtime
      # -----------------------------------------------------------------------
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DJANGO_SETTINGS_MODULE
        value: roadmap.settings
      - key: DJANGO_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        generateValue: true

      # -----------------------------------------------------------------------
      # Hosts & CORS
      # Set CORS_ALLOWED_ORIGINS and CSRF_TRUSTED_ORIGINS to your actual
      # Vercel frontend URL once it is known. The localhost entries below
      # are safe to remove after your first production deploy.
      # -----------------------------------------------------------------------
      - key: ALLOWED_HOSTS
        value: roadmap-smart-planner-backend.onrender.com,localhost,127.0.0.1
      - key: CORS_ALLOWED_ORIGINS
        value: https://roadmap-smart-ai-frontend.vercel.app,http://localhost:3000
      - key: CORS_ALLOWED_ORIGIN_REGEXES
        value: ^https://[a-z0-9-]+\.vercel\.app$
      - key: CSRF_TRUSTED_ORIGINS
        value: https://roadmap-smart-ai-frontend.vercel.app,http://localhost:3000

      # -----------------------------------------------------------------------
      # Database (Supabase PostgreSQL)
      # Fill in the four sync:false values in the Render dashboard:
      #   DB_NAME     → usually "postgres"
      #   DB_USER     → usually "postgres"
      #   DB_PASSWORD → Supabase project password
      #   DB_HOST     → db.<project-ref>.supabase.co
      # -----------------------------------------------------------------------
      - key: DB_ENGINE
        value: django.db.backends.postgresql
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "5432"
      - key: DB_CONN_MAX_AGE
        value: "60"
      - key: DB_CONN_HEALTH_CHECKS
        value: "true"
      - key: DB_SSLMODE
        value: require

      # -----------------------------------------------------------------------
      # Authentication & JWT
      # -----------------------------------------------------------------------
      - key: ACCESS_TOKEN_LIFETIME_MINUTES
        value: "60"
      - key: REFRESH_TOKEN_LIFETIME_DAYS
        value: "7"
      - key: MAX_ACTIVE_DEVICE_SESSIONS
        value: "0"
      - key: PASSWORD_RESET_URL
        sync: false  # e.g. https://your-app.vercel.app/reset-password

      # -----------------------------------------------------------------------
      # Google OAuth
      # GOOGLE_CLIENT_ID must match NEXT_PUBLIC_GOOGLE_CLIENT_ID on the frontend.
      # -----------------------------------------------------------------------
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_VERIFY_SSL
        value: "true"

      # -----------------------------------------------------------------------
      # Magic Link
      # -----------------------------------------------------------------------
      - key: MAGIC_LINK_TOKEN_MAX_AGE_SECONDS
        value: "900"
      - key: MAGIC_LINK_URL
        sync: false  # e.g. https://your-app.vercel.app/auth/magic

      # -----------------------------------------------------------------------
      # LLM — global config
      # Groq is the primary provider. OpenRouter is the fallback.
      # Both are free-tier friendly at MVP scale.
      # -----------------------------------------------------------------------
      - key: LLM_PRIMARY_PROVIDER
        value: groq
      - key: LLM_FALLBACKS
        value: openrouter:LLAMA_3_3_70B
      - key: LLM_REQUEST_TIMEOUT_SECONDS
        value: "90"
      - key: LLM_MAX_RETRIES
        value: "2"
      - key: LLM_RETRY_BACKOFF_SECONDS
        value: "1.5"
      - key: AI_DEBUG
        value: "false"

      # -----------------------------------------------------------------------
      # LLM — Groq provider
      # -----------------------------------------------------------------------
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: GROQ_MODEL
        value: LLAMA_3_3_70B
      - key: GROQ_LLAMA_MODEL
        value: llama-3.3-70b-versatile

      # -----------------------------------------------------------------------
      # LLM — OpenRouter provider (fallback)
      # -----------------------------------------------------------------------
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: OPENROUTER_MODEL
        value: LLAMA_3_3_70B
      - key: OPENROUTER_APP_NAME
        value: DayOneGoal
      - key: OPENROUTER_SITE_URL
        sync: false  # e.g. https://your-app.vercel.app

      # -----------------------------------------------------------------------
      # LLM — model routing (per feature)
      # All features use Groq (LLAMA_3_3_70B) in production.
      # JOURNAL_MODEL was GPT_OSS_120B (Ollama) — corrected to Groq.
      # -----------------------------------------------------------------------
      - key: HIERARCHY_MODEL
        value: GPT_OSS_120B
      - key: JOURNEYBOOK_MODEL
        value: GPT_OSS_120B
      - key: TIMELINE_MODEL
        value: LLAMA_3_3_70B
      - key: CURRENT_SITUATION_MODEL
        value: LLAMA_3_3_70B
      - key: GIE_LANGUAGE_MODEL
        value: LLAMA_3_3_70B
      - key: JOURNAL_MODEL
        value: LLAMA_3_3_70B  # was GPT_OSS_120B — Ollama is not available on Render
      - key: HABIT_RECOMMENDATION_MODEL
        value: LLAMA_3_3_70B
      - key: GOAL_ATTRIBUTE_MODEL
        value: GPT_OSS_120B
      - key: GOAL_CATEGORY_MODEL
        value: GPT_OSS_120B

      # -----------------------------------------------------------------------
      # Hierarchy constraints
      # -----------------------------------------------------------------------
      - key: HIERARCHY_MAX_MONTHS
        value: "12"
      - key: HIERARCHY_MAX_SUBGOALS_PER_MILESTONE
        value: "3"
      - key: HIERARCHY_MAX_TASKS_PER_SUBGOAL
        value: "5"
      - key: HIERARCHY_MAX_TOKENS
        value: "2400"
      - key: HIERARCHY_TASK_WORKERS
        value: "2"  # was 1 — safe to raise to 2 for production

      # -----------------------------------------------------------------------
      # GIE flags
      # -----------------------------------------------------------------------
      - key: GIE_ROLLOUT_ENABLED
        value: "true"
      - key: GIE_DEGRADED_MODE
        value: "false"

      # -----------------------------------------------------------------------
      # Celery
      # CELERY_TASK_ALWAYS_EAGER=true is intentional for now (MVP, free plan,
      # no separate Celery worker service). Tasks run inline on the web process.
      # When you add a worker service, set this to false and add REDIS_URL.
      # -----------------------------------------------------------------------
      - key: CELERY_TASK_ALWAYS_EAGER
        value: "true"

      # -----------------------------------------------------------------------
      # Cloudflare R2 storage
      # -----------------------------------------------------------------------
      - key: USE_R2_STORAGE
        value: "true"
      - key: R2_BUCKET_NAME
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_ENDPOINT_URL
        sync: false
      - key: R2_PUBLIC_BASE_URL
        sync: false

      # -----------------------------------------------------------------------
      # Email (Resend)
      # -----------------------------------------------------------------------
      - key: EMAIL_BACKEND
        value: django.core.mail.backends.smtp.EmailBackend
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false  # e.g. DayOneGoal <hello@dayonegoal.site>
      - key: DEFAULT_FROM_EMAIL
        sync: false  # e.g. noreply@dayonegoal.site

      # -----------------------------------------------------------------------
      # Monitoring (Sentry)
      # -----------------------------------------------------------------------
      - key: SENTRY_DSN
        sync: false
      - key: DISABLE_SENTRY
        value: "false"
      - key: SENTRY_TRACES_SAMPLE_RATE
        value: "0.1"
      - key: SENTRY_PROFILES_SAMPLE_RATE
        value: "0"
      - key: SENTRY_SEND_DEFAULT_PII
        value: "false"

      # -----------------------------------------------------------------------
      # External tools
      # -----------------------------------------------------------------------
      - key: HUGGINGFACE_API_KEY
        sync: false