name: Django CI

on:
  push:
    branches:
      - main        # run on main pushes
  pull_request:     # run on all PRs regardless of target branch

jobs:
  django:
    runs-on: ubuntu-latest
    env:
      # -----------------------------------------------------------------------
      # Django core
      # -----------------------------------------------------------------------
      DJANGO_SETTINGS_MODULE: roadmap.settings
      DJANGO_SECRET_KEY: ci-only-insecure-secret-key-not-used-in-production
      DJANGO_ENV: ci
      DEBUG: "true"

      # -----------------------------------------------------------------------
      # Database
      # CI_USE_SQLITE=true tells settings.py to use SQLite instead of PostgreSQL.
      # All DB_* vars are explicitly emptied so no accidental Supabase connection
      # is attempted if the SQLite branch is ever bypassed.
      # -----------------------------------------------------------------------
      CI_USE_SQLITE: "true"
      DB_ENGINE: ""
      DB_NAME: ""
      DB_USER: ""
      DB_PASSWORD: ""
      DB_HOST: ""
      DB_PORT: ""
      DB_SSLMODE: ""

      # -----------------------------------------------------------------------
      # Hosts & CORS (minimal CI values — no real frontend needed)
      # -----------------------------------------------------------------------
      ALLOWED_HOSTS: localhost,127.0.0.1
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      CSRF_TRUSTED_ORIGINS: http://localhost:3000

      # -----------------------------------------------------------------------
      # Celery — run tasks inline, no Redis or worker process needed
      # -----------------------------------------------------------------------
      REDIS_URL: ""
      CELERY_TASK_ALWAYS_EAGER: "true"
      CELERY_TASK_EAGER_PROPAGATES: "true"

      # -----------------------------------------------------------------------
      # LLM — all providers disabled in CI
      # No real API keys. Provider is set to ollama with a blank host so any
      # accidental AI call fails fast and visibly rather than hanging on a timeout.
      # -----------------------------------------------------------------------
      LLM_PRIMARY_PROVIDER: ollama
      LLM_FALLBACKS: ""
      LLM_REQUEST_TIMEOUT_SECONDS: "5"
      LLM_MAX_RETRIES: "0"
      LLM_RETRY_BACKOFF_SECONDS: "0"
      AI_DEBUG: "false"
      OLLAMA_HOST: ""
      GROQ_API_KEY: ""
      GROQ_BASE_URL: https://api.groq.com/openai/v1
      GROQ_MODEL: LLAMA_3_3_70B
      GROQ_LLAMA_MODEL: llama-3.3-70b-versatile
      OPENROUTER_API_KEY: ""
      OPENROUTER_BASE_URL: https://openrouter.ai/api/v1
      OPENROUTER_MODEL: LLAMA_3_3_70B
      JOURNAL_AI_PROVIDER: ollama

      # -----------------------------------------------------------------------
      # Model routing (CI-safe placeholder values)
      # -----------------------------------------------------------------------
      HIERARCHY_MODEL: LLAMA_3_3_70B
      JOURNEYBOOK_MODEL: LLAMA_3_3_70B
      TIMELINE_MODEL: LLAMA_3_3_70B
      CURRENT_SITUATION_MODEL: LLAMA_3_3_70B
      GIE_LANGUAGE_MODEL: LLAMA_3_3_70B
      JOURNAL_MODEL: LLAMA_3_3_70B
      HABIT_RECOMMENDATION_MODEL: LLAMA_3_3_70B
      GOAL_ATTRIBUTE_MODEL: LLAMA_3_3_70B
      GOAL_CATEGORY_MODEL: LLAMA_3_3_70B

      # -----------------------------------------------------------------------
      # Hierarchy constraints
      # -----------------------------------------------------------------------
      HIERARCHY_MAX_MONTHS: "12"
      HIERARCHY_MAX_SUBGOALS_PER_MILESTONE: "3"
      HIERARCHY_MAX_TASKS_PER_SUBGOAL: "5"
      HIERARCHY_MAX_TOKENS: "2400"
      HIERARCHY_TASK_WORKERS: "1"

      # -----------------------------------------------------------------------
      # GIE flags
      # -----------------------------------------------------------------------
      GIE_ROLLOUT_ENABLED: "true"
      GIE_DEGRADED_MODE: "false"

      # -----------------------------------------------------------------------
      # Auth — placeholder URLs (no real emails sent in CI)
      # -----------------------------------------------------------------------
      GOOGLE_CLIENT_ID: ""
      GOOGLE_VERIFY_SSL: "false"
      MAGIC_LINK_TOKEN_MAX_AGE_SECONDS: "900"
      MAGIC_LINK_URL: http://localhost:3000/auth/magic
      PASSWORD_RESET_URL: http://localhost:3000/reset-password
      ACCESS_TOKEN_LIFETIME_MINUTES: "60"
      REFRESH_TOKEN_LIFETIME_DAYS: "7"

      # -----------------------------------------------------------------------
      # Email — console backend so no SMTP server needed
      # -----------------------------------------------------------------------
      EMAIL_BACKEND: django.core.mail.backends.console.EmailBackend
      RESEND_API_KEY: ""
      RESEND_FROM_EMAIL: DayOneGoal <ci@localhost>
      DEFAULT_FROM_EMAIL: ci@localhost

      # -----------------------------------------------------------------------
      # Storage — local filesystem, no R2 needed
      # -----------------------------------------------------------------------
      USE_R2_STORAGE: "false"
      R2_ENDPOINT_URL: ""
      R2_BUCKET_NAME: ""
      R2_ACCESS_KEY_ID: ""
      R2_SECRET_ACCESS_KEY: ""
      R2_PUBLIC_BASE_URL: ""

      # -----------------------------------------------------------------------
      # Sentry — disabled in CI
      # -----------------------------------------------------------------------
      SENTRY_DSN: ""
      DISABLE_SENTRY: "true"
      SENTRY_TRACES_SAMPLE_RATE: "0"
      SENTRY_PROFILES_SAMPLE_RATE: "0"
      SENTRY_SEND_DEFAULT_PII: "false"

      # -----------------------------------------------------------------------
      # External tools — no real keys needed in CI
      # -----------------------------------------------------------------------
      HUGGINGFACE_API_KEY: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Django system check
        run: python roadmap/manage.py check

      - name: Run migrations
        run: python roadmap/manage.py migrate --noinput

      - name: Run tests
        run: python roadmap/manage.py test --verbosity=2