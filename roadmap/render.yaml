services:
  - type: web
    name: roadmap-smart-planner-backend
    runtime: python
    rootDir: roadmap-smart-planner-backend/roadmap
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate
    startCommand: gunicorn roadmap.wsgi:application --bind 0.0.0.0:$PORT --log-file -
    healthCheckPath: /health
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: roadmap.settings
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: LLM_PRIMARY_PROVIDER
        value: groq
      - key: LLM_FALLBACKS
        value: ""
      - key: GROQ_MODEL
        value: LLAMA_3_3_70B
      - key: OPENROUTER_MODEL
        value: LLAMA_3_3_70B
      - key: HIERARCHY_MODEL
        value: LLAMA_3_3_70B
      - key: JOURNEYBOOK_MODEL
        value: LLAMA_3_3_70B
      - key: TIMELINE_MODEL
        value: LLAMA_3_3_70B
      - key: CURRENT_SITUATION_MODEL
        value: LLAMA_3_3_70B
      - key: GIE_LANGUAGE_MODEL
        value: LLAMA_3_3_70B
      - key: JOURNAL_MODEL
        value: LLAMA_3_3_70B
      - key: HABIT_RECOMMENDATION_MODEL
        value: LLAMA_3_3_70B
      - key: GOAL_ATTRIBUTE_MODEL
        value: LLAMA_3_3_70B
      - key: GOAL_CATEGORY_MODEL
        value: LLAMA_3_3_70B
      - key: HIERARCHY_TASK_WORKERS
        value: "1"
  - type: worker
    name: roadmap-smart-planner-worker
    runtime: python
    rootDir: roadmap-smart-planner-backend/roadmap
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A roadmap worker --loglevel=INFO
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: roadmap.settings
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: LLM_PRIMARY_PROVIDER
        value: groq
      - key: LLM_FALLBACKS
        value: ""
      - key: GROQ_MODEL
        value: LLAMA_3_3_70B
      - key: OPENROUTER_MODEL
        value: LLAMA_3_3_70B
      - key: HIERARCHY_MODEL
        value: LLAMA_3_3_70B
      - key: JOURNEYBOOK_MODEL
        value: LLAMA_3_3_70B
      - key: TIMELINE_MODEL
        value: LLAMA_3_3_70B
      - key: CURRENT_SITUATION_MODEL
        value: LLAMA_3_3_70B
      - key: GIE_LANGUAGE_MODEL
        value: LLAMA_3_3_70B
      - key: JOURNAL_MODEL
        value: LLAMA_3_3_70B
      - key: HABIT_RECOMMENDATION_MODEL
        value: LLAMA_3_3_70B
      - key: GOAL_ATTRIBUTE_MODEL
        value: LLAMA_3_3_70B
      - key: GOAL_CATEGORY_MODEL
        value: LLAMA_3_3_70B
      - key: HIERARCHY_TASK_WORKERS
        value: "1"
